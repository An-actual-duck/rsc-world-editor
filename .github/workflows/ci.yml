name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Check out exact locked runtime provider
        run: ./scripts/checkout-runtime-provider.sh
      - name: Build and test standalone tooling
        env:
          RUNTIME_PROVIDER_DIR: .runtime-provider
        run: ./scripts/test.sh
